name: Сообщить о баге
description: Что-то не работает так, как должно
labels: [bug]

body:
  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Кратко и понятно опишите, что не так
      placeholder: Что произошло?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть страницу '...'
        2. Нажать на '...'
        3. Увидеть ошибку
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что произошло на самом деле?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Скриншоты / логи
      description: Если есть, приложите скриншот или вставьте логи из консоли

  - type: input
    id: browser
    attributes:
      label: Браузер
      placeholder: например, Chrome 142, Firefox 138, Safari 19

  - type: textarea
    id: context
    attributes:
      label: Дополнительный контекст
      description: Что-то ещё, что может помочь разобраться

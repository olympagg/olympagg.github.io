name: Normalize

on:
  pull_request_target:
    types: [labeled]

jobs:
  normalize:
    if: |
      github.event.label.name == 'normalize' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Remove normalize label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --remove-label normalize

      - uses: ./.github/actions/setup

      - run: bun parse

      - name: Verify parse output exists
        run: |
          test -f src/data/eventBundle.json || { echo "bun parse did not produce src/data/eventBundle.json"; exit 1; }
          test -d src/data/parsed || { echo "bun parse did not produce src/data/parsed/"; exit 1; }

      - run: bun normalize

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            gh pr comment "$PR" --body "Normalization produced no changes."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: bun normalize"
          git push

      - name: Trigger CI for normalize commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run push.yml --ref "$HEAD_REF"
